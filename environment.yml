# AetherCell conda environment
# Usage: conda env create -f environment.yml
#
# GPU note (optional): if you want CUDA support, install torch separately after
# creating the env, e.g.:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121

name: aethercell
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # ── Core deep learning ──────────────────────────────────────────
      - torch>=2.0.0
      - numpy>=1.24.0
      - scipy>=1.9.0

      # ── Data handling ───────────────────────────────────────────────
      - pandas>=1.5.0
      - h5py>=3.0.0
      - pyarrow>=10.0.0

      # ── HuggingFace stack (Molformer + LoRA) ────────────────────────
      - transformers>=4.30.0
      - tokenizers>=0.13.0
      - peft>=0.5.0
      - safetensors>=0.3.0
      - huggingface-hub>=0.16.0
      - accelerate>=0.20.0

      # ── ML utilities ────────────────────────────────────────────────
      - scikit-learn>=1.3.0
      - tqdm>=4.65.0
      - matplotlib>=3.5.0
      - pytest>=7.0.0

      # ── Network / file utilities (used by transformers / HF hub) ────
      - requests>=2.28.0
      - filelock>=3.9.0
      - pyyaml>=6.0
      - packaging>=23.0
      - typing-extensions>=4.5.0
      - regex>=2023.0.0

      # ── Optional: pathway enrichment (pathway_enrichment.py) ────────
      # Uncomment if you need GSEA / ORA analysis:
      # - gseapy>=1.0.0
